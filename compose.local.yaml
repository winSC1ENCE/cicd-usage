# Lokaler Testmodus: Seiten werden direkt in ./content geschrieben, ohne GitLab.
#   docker compose -f compose.yaml -f compose.override.yaml -f compose.local.yaml up -d --build
# (compose.override.yaml weglassen, wenn du keinen Proxy-CA brauchst)
services:
  app:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      WIKI_LOCAL_WRITE: "1"
    volumes:
      - ./content:/app/content
